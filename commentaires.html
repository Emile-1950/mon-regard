<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Livre d'Or - Mon Portfolio</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montez&display=swap');     
        .montez-regular {
           font-family: 'Montez', cursive;
           font-weight: 400;
           font-style: normal; }

        /* TES PROPRES STYLES POUR LES BOUTONS ET L'AFFICHAGE */
        .btn-container { text-align: center; margin-top: 25px; }
        
        .submit-btn { 
            color: white; 
            background: linear-gradient(135deg, #a86b18, #613903); 
            border: none; 
            padding: 5px 20px; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 25px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.4); 
            cursor: pointer; 
            transition: 0.2s; 
            font-family: 'Montez', cursive; 
            border: 2px dotted #a4b59f; }
        
        .submit-btn:hover { transform: scale(1.05); }
        
        .messages-display { 
            width: 100%; 
            max-width: 800px; 
            margin-top: 40px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; }
        
        .single-comment { 
            background-color: rgba(35, 35, 35, 0.9); 
            padding: 15px 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            border-left: 4px solid #7A4801;
            text-align: left;
            border-top: 2px dotted #7A4801;
            border-bottom: 2px dotted #7A4801;
            border-right: 2px dotted #7A4801; }
        
        /* Permet de positionner la croix par rapport à la bulle */
        .single-comment {
           position: relative; padding-right: 40px; /* Laisse de la place à droite pour la croix */}

        /* Style de la petite croix rouge */
        .btn-supprimer {
           position: absolute;
           top: 12px;
           right: 12px;
           background: none;
           border: none;
           color: #ff4d4d;
           font-size: 16px;
           cursor: pointer;
           opacity: 0.6;
           transition: 0.2s; }

        .btn-supprimer:hover {
           opacity: 1;
           transform: scale(1.2); }

        
        .back-btn { 
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-flex;
            flex-direction: column; /* Empile la maison en haut et le texte en bas */
            align-items: center;    /* Centre le mot "Accueil" juste sous la maison */
            gap: 5px;               /* Petit espace entre l'icône et le mot */
            color: #E1C9A8; 
            text-decoration: none; 
            font-family: 'Montez', cursive; 
            font-size: 18px;        /* Taille élégante pour ce petit mot */
            font-weight: bold;
            transition: 0.3s;
            z-index: 10;
            margin-left: 30px; }

        .back-btn:hover { 
            color: #fff;
            transform: scale(1.05); }



        /* AJUSTEMENTS POUR LE FOND BOLLY ET LES ZONES DE TEXTE */
        body { 
            font-family: 'Montez', cursive; 
            text-align: center; 
            padding: 40px 20px;
            background-image: 
                linear-gradient(rgba(30, 25, 20, 0.75), rgba(30, 25, 20, 0.75)), 
                url('https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Bannie%CC%80re/Fond%20L%20or.jpg'); /*image de fond*/
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center; }

        .comment-box {
            width: 100%;
            max-width: 800px;
            background: rgba(17, 17, 17, 0.85);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #7A4801;
            box-shadow: 0px 0px 20px 2px rgba(122, 72, 1, 0.4);
            box-sizing: border-box; }

        .comment-box h2 {
            font-size: 36px;
            color: #E1C9A8;
            margin-top: 0;
            margin-bottom: 25px;
            font-family: 'Montez', cursive; }

        form label {
            display: block;
            text-align: left;
            font-size: 25px;
            color: #E1C9A8;
            margin: 15px 0 5px 5px; }

        input[type="text"], textarea {
            width: 100%;
            padding: 5px 20px;
            font-size: 25px;
            font-family: 'Montez', cursive;
            background-color: #222;
            border: 1px solid #7A4801;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            transition: 0.3s; }

        input[type="text"]:focus, textarea:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.5); }
    </style>
</head>
<body>

    <!--bouton accueil-->
<a href="index.html" class="back-btn">
    <img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Bannie%CC%80re/vecteezy_3d-home-icon-on-transparent-background-for-real-estate_49766829%20(1).png" alt="Accueil" class="icone-maison">
    <span>Accueil</span></a>

    <!-- ZONE 1 : ÉCRIRE UN COMMENTAIRE -->
    <div class="comment-box">
        <h2>✍️ Le Livre d'Or du Portfolio</h2>
        
        <form id="commentForm" onsubmit="ajouterCommentaire(event)">
            <label for="visitorName">Votre nom ou pseudo :</label>
            <input type="text" id="visitorName" required placeholder="Ex: Marie, Jean...">
            
            <label for="visitorMessage">Votre message :</label>
            <textarea id="visitorMessage" rows="5" required placeholder="Laissez votre petit mot ici..."></textarea>
            
            <div class="btn-container">
                <button type="submit" class="submit-btn">💬 Poster mon message</button>
            </div>
        </form>
    </div>

    <!-- ZONE 2 : AFFICHAGE AUTOMATIQUE DES MESSAGES -->
    <div class="messages-display">
        <h3 style="color: #E1C9A8; font-family: 'Montez', cursive; margin-top: -15px; font-size: 30px; margin-bottom: 10px; text-align: center; width: 100%;">💬 Les commentaires postés</h3>
        <div id="commentsContainer" style="width: 100%; display: flex; flex-direction: column; gap: 20px;"></div>
    </div>

         <!-- LE SCRIPT CONNECTÉ À GOOGLE SHEETS -->
    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4Gv8VDHwUegdSSucS1BF34KbLlEEp-pHYtBGnheZlQHp-0BIMM190Zv-0rjxAkmvf/exec";

        function afficherCommentaires() {
            const container = document.getElementById('commentsContainer');
            container.innerHTML = '<p style="text-align:center; color:#E1C9A8; font-style:italic;">Chargement des messages...</p>';
            
            fetch(GOOGLE_SCRIPT_URL)
                .then(response => response.json())
                .then(commentaires => {
                    container.innerHTML = '';
                    
                    if (commentaires.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color:#888; font-family: "Montez", cursive; font-style:italic;">Aucun message pour le moment. Soyez le premier !</p>';
                        return;
                    }
                    
                    commentaires.forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'single-comment';
                        div.innerHTML = `
                            <p style="margin: 0 0 8px 0; color: #E1C9A8; font-weight: bold; font-size: 25px; font-family: 'Montez', cursive;">👤 ${c.nom} <span style="color: #728282; font-family: 'Montez', cursive; font-weight: normal; font-size: 22px; margin-left: 10px;">${new Date(c.date).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
</span></p>
                            <p style="margin: 0; color: white; font-family: 'Montez', cursive; font-size: 37px; line-height: 1.4;">"${c.texte}"</p>
                        `;
                        container.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    container.innerHTML = '<p style="text-align:center; font-family: "Montez", cursive; color:#ff4d4d;">Impossible de charger les commentaires.</p>';
                });
        }

        function ajouterCommentaire(event) {
            event.preventDefault();
            
            const nomInput = document.getElementById('visitorName');
            const messageInput = document.getElementById('visitorMessage');
            const btnSubmit = document.querySelector('.submit-btn');
            
            const texteOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = "⏳ Envoi en cours...";
            btnSubmit.disabled = true;

            const donnees = {
                nom: nomInput.value,
                texte: messageInput.value
            };
            
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(donnees)
            })
            .then(response => response.json())
            .then(data => {
                nomInput.value = '';
                messageInput.value = '';
                btnSubmit.innerHTML = texteOriginal;
                btnSubmit.disabled = false;
                
                afficherCommentaires();
            })
            .catch(error => {
                console.error('Erreur:', error);
                alert("Une erreur s'est produite lors de l'envoi.");
                btnSubmit.innerHTML = texteOriginal;
                btnSubmit.disabled = false;
            });
        }

        document.addEventListener('DOMContentLoaded', afficherCommentaires);
    </script>

</body>
</html>
