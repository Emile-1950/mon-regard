<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Livre d'Or - Mon Portfolio</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montez&display=swap');     
        .montez-regular {
           font-family: 'Montez', cursive;
           font-weight: 400;
           font-style: normal; }

        /* TES PROPRES STYLES POUR LES BOUTONS ET L'AFFICHAGE */
        .btn-container { text-align: center; margin-top: 25px; }
        
        .submit-btn { 
            color: white; 
            background: linear-gradient(135deg, #a86b18, #613903); 
            border: none; 
            padding: 5px 20px; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 25px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.4); 
            cursor: pointer; 
            transition: 0.2s; 
            font-family: 'Montez', cursive; 
            border: 2px dotted #a4b59f; }
        
        .submit-btn:hover { transform: scale(1.05); }
        
        .messages-display { 
            width: 100%; 
            max-width: 800px; 
            margin-top: 40px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; }
        
        .single-comment { 
            background-color: rgba(35, 35, 35, 0.9); 
            padding: 15px 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            border-left: 4px solid #7A4801;
            text-align: left; }
        
        .back-btn { 
            position: absolute; /* Permet de le positionner précisément */
            top: 20px;          /* Distance par rapport au haut de l'écran */
            left: 20px;         /* Distance par rapport à la gauche de l'écran */
            color: #E1C9A8; 
            text-decoration: none; 
            font-family: 'Montez', cursive; 
            font-size: 26px;    /* Légèrement affiné pour le coin de page */
            font-weight: bold;
            transition: 0.3s;
            z-index: 10;        /* Assure que le bouton reste toujours visible par-dessus le fond */ }

        .back-btn:hover { 
            color: #fff;
            transform: scale(1.05); /* Petit effet de survol sympathique */ }


        /* AJUSTEMENTS POUR LE FOND BOLLY ET LES ZONES DE TEXTE */
        body { 
            font-family: 'Montez', cursive; 
            text-align: center; 
            padding: 40px 20px;
            background-image: 
                linear-gradient(rgba(30, 25, 20, 0.75), rgba(30, 25, 20, 0.75)), 
                url('https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Bannie%CC%80re/Fond%20L%20or.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center; }

        .comment-box {
            width: 100%;
            max-width: 800px;
            background: rgba(17, 17, 17, 0.85);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #7A4801;
            box-shadow: 0px 0px 20px 2px rgba(122, 72, 1, 0.4);
            box-sizing: border-box; }

        .comment-box h2 {
            font-size: 36px;
            color: #E1C9A8;
            margin-top: 0;
            margin-bottom: 25px;
            font-family: 'Montez', cursive; }

        form label {
            display: block;
            text-align: left;
            font-size: 25px;
            color: #E1C9A8;
            margin: 15px 0 5px 5px; }

        input[type="text"], textarea {
            width: 100%;
            padding: 5px 20px;
            font-size: 25px;
            font-family: 'Montez', cursive;
            background-color: #222;
            border: 1px solid #7A4801;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            transition: 0.3s; }

        input[type="text"]:focus, textarea:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.5); }
    </style>
</head>
<body>

<a href="index.html" class="back-btn">⬅️ Retour à l'accueil</a>

    <!-- ZONE 1 : ÉCRIRE UN COMMENTAIRE -->
    <div class="comment-box">
        <h2>✍️ Le Livre d'Or du Portfolio</h2>
        
        <form id="commentForm" onsubmit="ajouterCommentaire(event)">
            <label for="visitorName">Votre nom ou pseudo :</label>
            <input type="text" id="visitorName" required placeholder="Ex: Marie, Jean...">
            
            <label for="visitorMessage">Votre message :</label>
            <textarea id="visitorMessage" rows="5" required placeholder="Laissez votre petit mot ici..."></textarea>
            
            <div class="btn-container">
                <button type="submit" class="submit-btn">💬 Poster mon message</button>
            </div>
        </form>
    </div>

    <!-- ZONE 2 : AFFICHAGE AUTOMATIQUE DES MESSAGES -->
    <div class="messages-display">
        <h3 style="color: #E1C9A8; font-family: 'Montez', cursive; font-size: 30px; border-bottom: 1px solid #7A4801; padding-bottom: 10px; margin: 0 auto; text-align: center; width: 100%;">💬 Les commentaires postés</h3>
        <div id="commentsContainer" style="width: 100%; display: flex; flex-direction: column; gap: 20px;"></div>
    </div>

    <!-- LE SCRIPT SANS SERVEUR D'ÉMILE -->
    <script>
        function afficherCommentaires() {
            const container = document.getElementById('commentsContainer');
            container.innerHTML = '';
            
            const commentaires = JSON.parse(localStorage.getItem('livreDorEmile')) || [];
            
            if (commentaires.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888; font-style:italic;">Aucun commentaire pour le moment.</p>';
                return;
            }
            
            commentaires.forEach(c => {
                const div = document.createElement('div');
                div.className = 'single-comment';
                div.innerHTML = `
                    <p style="margin: 0 0 8px 0; color: #E1C9A8; font-weight: bold; font-size: 18px; font-family: 'Montez', cursive;">👤 ${c.nom} <span style="color: #cd8d1a; font-family: 'Montez', cursive; font-weight: normal; font-size: 16px; margin-left: 10px;">${c.date}</span></p>
                    <p style="margin: 0; color: white; font-family: 'Montez', cursive; font-size: 25px; line-height: 1.4;">"${c.texte}"</p>
                `;
                container.appendChild(div);
            });
        }

        function ajouterCommentaire(event) {
            event.preventDefault();
            
            const nomInput = document.getElementById('visitorName');
            const messageInput = document.getElementById('visitorMessage');
            
            const dateActuelle = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            
            const nouveauCommentaire = {
                nom: nomInput.value,
                texte: messageInput.value,
                date: dateActuelle
            };
            
            const commentaires = JSON.parse(localStorage.getItem('livreDorEmile')) || [];
            commentaires.unshift(nouveauCommentaire);
            
            localStorage.setItem('livreDorEmile', JSON.stringify(commentaires));
            
            nomInput.value = '';
            messageInput.value = '';
            
            afficherCommentaires();
        }

        document.addEventListener('DOMContentLoaded', afficherCommentaires);
    </script>

</body>
</html>
