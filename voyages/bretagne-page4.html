    display: inline-flex;

    height: 65px;
    border-radius: 50%; /* Rend le bouton parfaitement rond */

    color: white !important;
    text-decoration: none;
    font-size: 20px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* La jolie ombre portée */
    transition: all 0.3s ease; /* Pour une animation fluide */
    cursor: pointer;
    box-shadow: 0px 0px 10px 0px #d6cd9c; }

/* Effet au survol de la souris */
.nav-bouton-rond:hover {
    transform: translateY(-3px); /* Le bouton se soulève légèrement */
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7); /* L'ombre devient plus intense */
    background: linear-gradient(135deg, #c58224, #7a4801); /* Éclaircissement au survol */
}

/* Conteneur pour aligner les deux boutons côte à côte */

    <script>
        // Ton système de zoom automatique magique qui fonctionne tout seul !
        const popup = document.createElement('div');
        popup.style.cssText = "display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; cursor:pointer;";
        const popupImg = document.createElement('img');
        popupImg.style.cssText = "max-width:90%; max-height:85%; border-radius:8px; object-fit:contain;";
        popup.appendChild(popupImg);
        document.body.appendChild(popup);

        document.querySelectorAll('.galerie img').forEach(img => {
            img.style.cursor = "pointer";
            img.addEventListener('click', () => {
                popupImg.src = img.src;
                popup.style.display = "flex";
            });
        });
        popup.addEventListener('click', () => popup.style.display = "none");
    </script>

    <script>
        document.querySelectorAll('.photo-item').forEach(item => {
            const img = item.querySelector('img');
            if(img && img.getAttribute('alt')) {
                const p = document.createElement('p');
                p.textContent = img.getAttribute('alt');
                p.style.margin = "10px 0 0 0";
                p.style.fontSize = "14px";
                p.style.color = "#E1C9A8";
                p.style.fontWeight = "bold";
                item.appendChild(p);
            }
        });
