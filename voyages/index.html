<!DOCTYPE html>

    <title>Mes Voyages - Mon Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montez&display=swap');

.montez-regular {
    font-family: "Montez", cursive;
    font-weight: 400;
    font-style: normal; }

body { 
    font-family: "Montez", cursive; 
    background-image: url('https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Bannie%CC%80re/pezibear-desert-790640_1920.jpg'); 
    text-align: center; 
    padding: 20px 20px; }

/* Grille des destinations - C'est elle qui force toutes ses cases à avoir la même hauteur ! */
.menu-voyages { 
    font-family: "Montez", cursive; 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
    grid-auto-rows: 1fr; /* Placé ici, au bon endroit, ça aligne toutes les hauteurs ! */
    gap: 15px; 
    margin: 40px auto; 
    max-width: 1100px; }

/* Le style de tes superbes boutons de destinations du bas */
.btn-destination { 
    font-family: "Montez", cursive; 
    padding: 12px 20px; 
    font-size: 24px; 
    font-weight: bold; 
    color: white; 
    background-color: #111111; 
    border: 2px solid #7A4801; 
    box-shadow: 0px 0px 12px 1px #7A4801; 
    border-radius: 12px; 
    cursor: pointer; 
    transition: 0.3s; 
    display: flex; /* Utilisation de flex standard pour les boutons de grille */
    align-items: center;
    justify-content: center; /* Aligne l'icône et le texte bien au centre du bouton */
    gap: 10px; 
    height: 100%; /* Dit au bouton de remplir toute la hauteur de sa case */
    width: 100%;  /* Dit au bouton de remplir toute la largeur de sa case */ }

/* Effet de survol sur les destinations */
.btn-destination:hover { 
    background-color: #2a2a2a; 
    border-color: #007bff; 
    transform: scale(1.03); }

/* Bouton Retour à l'accueil du haut */
.bouton-accueil { 
    display: inline-flex; 
    align-items: center;
    gap: 8px;
    margin-bottom: 30px; 
    text-decoration: none; 
    color: #E1C9A8; 
    font-size: 20px; }

.bouton-accueil:hover { 
    color: #fff; }
 </style>
