<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes Voyages - Mon Portfolio</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding: 40px 20px; }
        .menu-voyages { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 50px; }
        .btn-destination { width: 80%; max-width: 400px; padding: 20px; font-size: 20px; font-weight: bold; color: white; background-color: #1e1e1e; border: 2px solid #333; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: left; padding-left: 30px; }

        .bouton-accueil { display: inline-block; margin-bottom: 30px; text-decoration: none; color: #aaa; font-size: 16px; }
        .bouton-accueil:hover { color: #fff; }

</head>
<body>

    <a href="../index.html" class="bouton-accueil">⬅️ Retour à l'accueil du portfolio</a>

    <h1>✈️ Choisissez une destination</h1>
    <p>Cliquez sur un voyage pour découvrir mes galeries photos</p>

    <div class="menu-voyages">
        <button class="btn-destination" onclick="window.location.href='provence.html'">☀️🌾 Voyage en Provence</button>
        <button class="btn-destination" onclick="window.location.href='londres.html'">🇬🇧 Voyage à Londres</button>
        <!-- On pourra ajouter Paris, Venise et tes autres voyages juste ici plus tard ! -->

</html>
