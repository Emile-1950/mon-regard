<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>🎭Voyage à Venise - Mon Portfolio</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; padding: 20px; }
        .galerie { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .galerie img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .photo-item { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
        .description { margin-top: 10px; font-weight: bold; color: #fff; font-size: 14px; text-align: center; }
    </style>
</head>

<div style="text-align: center;"><a href="index.html" style="display: inline-block; margin-bottom: 20px; text-decoration: none; color: #aaa; font-size: 16px;">⬅️ Retour au menu des voyages</a></div>

<body>
    <h1 style="text-align: center; margin-top: 25px;">Voyage à Venise</h1>

       <div class="galerie">
       <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Venise/DSC02517.jpg" alt="gondole"></div>
       <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Venise/DSC02547.jpg" alt="la lagune"></div>
       <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Venise/DSC02578.jpg" alt="romantisme"></div>
       <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Venise/basilique%20san%20Giorgio%20Maggiore.jpg" alt="Basilique San Marci di Maggiore"></div>
 </div>

      <!-- Bloc de navigation de la Page 3 -->
    <div class="pagination" style="text-align: center; margin-top: 40px; margin-bottom: 20px;">
        <a href="venise-page2.html" style="padding: 10px 15px; margin: 0 5px; background-color: #1e1e1e; color: white; border: 1px solid #333; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.3s;">⬅️ 2</a>
        <span style="padding: 10px 15px; margin: 0 5px; background-color: #007bff; color: white; border-radius: 5px; font-weight: bold;">3</span>
    </div>

    
<script>
        // Ton système de zoom automatique magique qui fonctionne tout seul !
        const popup = document.createElement('div');
        popup.style.cssText = "display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; cursor:pointer;";
        const popupImg = document.createElement('img');
        popupImg.style.cssText = "max-width:90%; max-height:85%; border-radius:8px; object-fit:contain;";
        popup.appendChild(popupImg);
        document.body.appendChild(popup);

        document.querySelectorAll('.galerie img').forEach(img => {
            img.style.cursor = "pointer";
            img.addEventListener('click', () => {
                popupImg.src = img.src;
                popup.style.display = "flex";
            });
        });
        popup.addEventListener('click', () => popup.style.display = "none");
    </script>
</body>
</html>
