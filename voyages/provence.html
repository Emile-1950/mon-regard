<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Voyage Provence - Mon Portfolio</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; text-align: center; padding: 20px; }
        .galerie { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .galerie img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Style pour la pagination tout en bas */
        .pagination { margin: 40px 0; display: flex; justify-content: center; gap: 10px; }
        .pagination a, .pagination span { padding: 10px 15px; border-radius: 5px; text-decoration: none; color: #333; background: white; border: 1px solid #ddd; }
        .pagination .active { background: #007bff; color: white; border-color: #007bff; font-weight: bold; }
        .pagination a:hover { background: #eee; }
        
        .bouton-retour { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #666; }
    </style>
</head>
<body>

    <a href="index.html" class="bouton-retour">⬅️ Retour aux destinations</a>

    <h1>🌞 Voyage Provence</h1>

    <!-- C'est ici que tu mettras tes 10 premières images -->
    <div class="galerie">
        <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Provence%20I/DSC03499-Avec%20accentuation-Bruit.jpg" alt="pont du Gard"></div>
        <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Provence%20I/DSC03458-Avec%20accentuation-Bruit.jpg" alt="Avignon"></div>
        <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Provence%20I/DSC03521.jpg" alt="Isle-sur-la-Sorgues"></div>
        <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Provence%20I/DSC03554.jpg" alt="Gordes"></div>
        <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Provence%20I/DSC03613.jpg" alt="baux-de-Provence"></div>
        <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Provence%20I/DSC03674.jpg" alt="coucher de soleil"></div>
        <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Provence%20I/DSC03649-Avec%20accentuation-Bruit.jpg" alt="fraîcheur"></div>
        <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Provence%20I/DSC03524.jpg" alt="Isle-sur-la-Sorgues"></div>

        
        


        <!-- Tu pourras copier-coller ces lignes pour aller jusqu'à 10 photos -->
    </div>
    <!-- Bloc de navigation : Page 1 -->
    <div class="pagination" style="text-align: center; margin-top: 40px; margin-bottom: 20px;">
        <span style="padding: 10px 15px; margin: 0 5px; background-color: #007bff; color: white; border-radius: 5px; font-weight: bold;">1</span>
        <a href="provence-page2.html" style="padding: 10px 15px; margin: 0 5px; background-color: #1e1e1e; color: white; border: 1px solid #333; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.3s;">2 ➡️</a>
    </div>

    <!-- Ton système de zoom automatique ET affichage automatique des légendes ! -->
    <script>
        // 1. Création de la boîte de texte sous chaque image automatiquement à partir du "alt"
        document.querySelectorAll('.galerie img').forEach(img => {
            if (img.getAttribute('alt')) {
                // On vérifie s'il n'y a pas déjà une description pour éviter les doublons
                const parent = img.parentNode;
                if (!parent.classList.contains('photo-item')) {
                    const boite = document.createElement('div');
                    boite.className = 'photo-item';
                    boite.style.cssText = "display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;";
                    
                    const desc = document.createElement('p');
                    desc.style.cssText = "margin-top: 10px; font-weight: bold; color: #fff; font-size: 14px; text-align: center; margin-bottom: 0;";
                    desc.textContent = img.getAttribute('alt');
                    
                    img.style.cursor = "pointer";
                    img.parentNode.insertBefore(boite, img);
                    boite.appendChild(img);
                    boite.appendChild(desc);
                }
            }
        });

        // 2. Système de zoom Pop-up au clic
        const popup = document.createElement('div');
        popup.style.cssText = "display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; cursor:pointer;";
        const popupImg = document.createElement('img');
        popupImg.style.cssText = "max-width:90%; max-height:85%; border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,0.5); object-fit:contain;";
        const boutonFermer = document.createElement('span');
        boutonFermer.textContent = "✕";
        boutonFermer.style.cssText = "position:absolute; top:20px; right:30px; color:#fff; font-size:30px; font-weight:bold;";
        
        popup.appendChild(popupImg);
        popup.appendChild(boutonFermer);
        document.body.appendChild(popup);

        document.querySelectorAll('.galerie img').forEach(img => {
            img.addEventListener('click', () => {
                popupImg.src = img.src;
                popup.style.display = "flex";
            });
        });

        popup.addEventListener('click', () => {
            popup.style.display = "none";
        });
</script>
</body>
</html>
