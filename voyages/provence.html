    <!-- Ton système de zoom automatique ET affichage automatique des légendes ! -->
        <!-- Script universel pour forcer l'affichage des légendes -->
    <script>
        document.querySelectorAll('.galerie img').forEach(img => {
            if (img.getAttribute('alt')) {
                // On vérifie s'il y a déjà un texte en dessous pour éviter les doublons
                if (!img.nextElementSibling || !img.nextElementSibling.classList.contains('description')) {
                    const desc = document.createElement('div');
                    desc.className = 'description';
                    desc.style.cssText = "margin-top: 10px; font-weight: bold; color: #fff; font-size: 14px; text-align: center;";
                    desc.innerText = img.getAttribute('alt');
                    img.parentNode.insertBefore(desc, img.nextSibling);
                }
            }
        });

        // Système de zoom Pop-up au clic
        const popup = document.createElement('div');
        popup.style.cssText = "display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; cursor:pointer;";
        const popupImg = document.createElement('img');
        popupImg.style.cssText = "max-width:90%; max-height:85%; border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,0.5); object-fit:contain;";
        popup.appendChild(popupImg);
        document.body.appendChild(popup);

        document.querySelectorAll('.galerie img').forEach(img => {
            img.style.cursor = "pointer";
            img.addEventListener('click', () => {
                popupImg.src = img.src;
                popup.style.display = "flex";
            });
        });

        popup.addEventListener('click', () => {
            popup.style.display = "none";
        });
    </script>
