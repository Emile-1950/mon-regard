<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Voyage Londres - Mon Portfolio</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; text-align: center; padding: 20px; }
        .galerie { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .galerie img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Style pour la pagination tout en bas */
        .pagination { margin: 40px 0; display: flex; justify-content: center; gap: 10px; }
        .pagination a, .pagination span { padding: 10px 15px; border-radius: 5px; text-decoration: none; color: #333; background: white; border: 1px solid #ddd; }
        .pagination .active { background: #007bff; color: white; border-color: #007bff; font-weight: bold; }
        .pagination a:hover { background: #eee; }
        
        .bouton-retour { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #666; }
    </style>
</head>
<body>

    <div style="text-align: center;"><a href="index.html" style="display: inline-block; margin-bottom: 20px; text-decoration: none; color: #aaa; font-size: 16px;">⬅️ Retour aux destinations</a></div>
    
<h1>🏴󠁧󠁢󠁥󠁮󠁧󠁿Voyage Londres</h1>
    <p>Page 1 - Les 10 premières photos</p>

    <!-- C'est ici que tu mettras tes 10 premières images -->
    <div class="galerie">
        <div class="photo-item"><img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Londres%202/%20DSC04285.jpeg" alt="Big Ben"></div>
        <div class="photo-item"><img src="METS_TON_LIEN_PCLOUD_2_ICI.jpg" alt="📸 Description de la photo 2"></div>
        <div class="photo-item"><img src="METS_TON_LIEN_PCLOUD_3_ICI.jpg" alt="📸 Description de la photo 3"></div>
        <div class="photo-item"><img src="METS_TON_LIEN_PCLOUD_4_ICI.jpg" alt="📸 Description de la photo 4"></div>
        <div class="photo-item"><img src="METS_TON_LIEN_PCLOUD_5_ICI.jpg" alt="📸 Description de la photo 5"></div>
        <div class="photo-item"><img src="METS_TON_LIEN_PCLOUD_6_ICI.jpg" alt="📸 Description de la photo 6"></div>
        <div class="photo-item"><img src="METS_TON_LIEN_PCLOUD_7_ICI.jpg" alt="📸 Description de la photo 7"></div>
        <div class="photo-item"><img src="METS_TON_LIEN_PCLOUD_8_ICI.jpg" alt="📸 Description de la photo 8"></div>

    </div>
 
    <!-- Les boutons de pagination magiques -->
    <div class="pagination">
        <span class="active">1</span>
        <!-- Quand tu créeras la page 2, ce bouton fonctionnera tout seul -->
        <a href="londres-page2.html">2 »</a>
        <a href="londres-page3.html">3 »</a>
        <a href="londres-page4.html">4 »</a>
        <a href="londres-page5.html">5 »</a>
        <a href="londres-page6.html">6 »</a>
    </div>
    <div style="text-align: center; margin-top: 30px;">
   </div>

    <!-- Ton système de zoom automatique ET affichage automatique des légendes ! -->
    <script>
        // 1. Création de la boîte de texte sous chaque image automatiquement
        document.querySelectorAll('.photo-item').forEach(item => {
            const img = item.querySelector('img');
            if (img && img.getAttribute('alt')) {
                const desc = document.createElement('div');
                desc.className = 'description';
                desc.innerText = img.getAttribute('alt');
                item.appendChild(desc);
            }
        });

        // 2. Système de zoom Pop-up au clic
        const popup = document.createElement('div');
        popup.style.cssText = "display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center; cursor:pointer;";
        const popupImg = document.createElement('img');
        popupImg.style.cssText = "max-width:90%; max-height:85%; border-radius:8px; object-fit:contain;";
        popup.appendChild(popupImg);
        document.body.appendChild(popup);

        document.querySelectorAll('.photo-item img').forEach(img => {
            img.addEventListener('click', () => {
                popupImg.src = img.src;
                popup.style.display = 'flex';
            });
        });

        popup.addEventListener('click', () => {
            popup.style.display = 'none';
        });
    </script>
</body>
</html>
