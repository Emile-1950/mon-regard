    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .galerie { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .photo-item { background: #222; padding: 10px; border-radius: 8px; border: 1px solid #7A4801; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; }
        .photo-item img { width: 100%; height: 180px; object-fit: cover; object-position: center; border-radius: 4px; cursor: pointer; }
        .bouton-retour { display: inline-block; text-decoration: none; color: #E1C9A8; font-weight: bold; }
        .bouton-retour:hover { color: white; }
    </style>
</head>
<body>

    <div style="grid-column: 1 / -1; width: 100%; text-align: center; margin: 40px auto; display: flex; justify-content: center; align-items: center; gap: 10px;">

        </div>

    <script>
        document.querySelectorAll('.galerie img').forEach(img => {
            if (img.getAttribute('alt')) {
                // On vérifie s'il y a déjà un texte en dessous pour éviter les doublons
                if (!img.nextElementSibling || !img.nextElementSibling.classList.contains('description')) {
                    const desc = document.createElement('div');
                    desc.className = 'description';
                    desc.style.cssText = "margin-top: 10px; font-weight: bold; color: #fff; font-size: 14px; text-align: center;";
                    desc.innerText = img.getAttribute('alt');
                    img.parentNode.insertBefore(desc, img.nextSibling);
                }
            }
        });

        // Système de zoom Pop-up au clic
        const popup = document.createElement('div');
        popup.style.cssText = "display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; cursor:pointer;";
        const popupImg = document.createElement('img');
        popupImg.style.cssText = "max-width:90%; max-height:85%; border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,0.5); object-fit:contain;";
        popup.appendChild(popupImg);
        document.body.appendChild(popup);

        document.querySelectorAll('.galerie img').forEach(img => {
            img.style.cursor = "pointer";
            img.addEventListener('click', () => {
                popupImg.src = img.src;
                popup.style.display = "flex";
            });
        });
        popup.addEventListener('click', () => {
            popup.style.display = "none";
        });
    </script>
 <script src="https://unpkg.com"></script>
