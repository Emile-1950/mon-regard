<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Mes plus belles Fleurs</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .galerie { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .photo-item { background: #222; padding: 10px; border-radius: 8px; border: 1px solid #7A4801; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; }
        .photo-item img { max-width: 100%; height: auto; border-radius: 4px; }
        .photo-item p { margin: 10px 0 0 0; font-size: 14px; color: #E1C9A8; font-weight: bold; }
        .bouton-retour { display: inline-block; text-decoration: none; color: #666; font-weight: bold; }
    </style>
</head>
<body>

    <!-- L'unique galerie du site -->
    <div class="galerie">
        
        <!-- Le menu supérieur vertical et centré par Émile (Lien direct sans ../) -->
        <div style="grid-column: 1 / -1; width: 100%; text-align: center; margin: 20px 0; display: flex; flex-direction: column; align-items: center; gap: 12px;">
            <button class="folder-btn" onclick="window.location.href='commentaires.html'" style="color: white !important; background: linear-gradient(135deg, #a86b18, #613903) !important; border: none !important; padding: 10px 25px !important; font-size: 15px !important; font-weight: bold !important; border-radius: 25px !important; box-shadow: 0 4px 6px rgba(0,0,0,0.4) !important; cursor: pointer !important; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 5px;"><i data-lucide="book-open"></i> Livre d'or</button>
            <a href="index.html" class="bouton-retour" style="margin: 0;">⬅️ Retour au menu</a>
        </div>

        <!-- Le titre principal centré pile au milieu -->
        <h1 style="grid-column: 1 / -1; width: 100%; text-align: center; color: white; margin-bottom: 30px;">🌸 Mes plus belles Fleurs</h1>

        <!-- TON PREMIER BLOC IMAGE (Exemple à remplacer avec tes liens pCloud roses) -->
        <div class="photo-item">
            <img src="https://unsplash.com" alt="Fleur">
            <p>Mon premier cliché de Fleur</p>
        </div>

        <!-- La barre de pagination 100 % exacte pour la PAGE 1 de tes Fleurs -->
        <div style="grid-column: 1 / -1; width: 100%; text-align: center; margin: 40px auto; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <a href="fleurs.html" style="color: #666; text-decoration: none; padding: 8px 14px; border: 1px solid #7A4801; border-radius: 5px; background: #111;">&laquo;</a>
            <a href="fleurs.html" style="color: white; text-decoration: none; padding: 8px 14px; border: 1px solid #7A4801; border-radius: 5px; background: linear-gradient(135deg, #a86b18, #613903); font-weight: bold;">1</a>
            <a href="fleurs-page2.html" style="color: #E1C9A8; text-decoration: none; padding: 8px 14px; border: 1px solid #7A4801; border-radius: 5px; background: #111;">2</a>
            <a href="fleurs-page3.html" style="color: #E1C9A8; text-decoration: none; padding: 8px 14px; border: 1px solid #7A4801; border-radius: 5px; background: #111;">3</a>
            <a href="fleurs-page4.html" style="color: #E1C9A8; text-decoration: none; padding: 8px 14px; border: 1px solid #7A4801; border-radius: 5px; background: #111;">4</a>
            <a href="fleurs-page5.html" style="color: #E1C9A8; text-decoration: none; padding: 8px 14px; border: 1px solid #7A4801; border-radius: 5px; background: #111;">5</a>
            <a href="fleurs-page6.html" style="color: #E1C9A8; text-decoration: none; padding: 8px 14px; border: 1px solid #7A4801; border-radius: 5px; background: #111;">6</a>
            <a href="fleurs-page2.html" style="color: #E1C9A8; text-decoration: none; padding: 8px 14px; border: 1px solid #7A4801; border-radius: 5px; background: #111;">&raquo;</a>
        </div>

    </div>

    <!-- Le script magique Luciole pour dessiner l'icône du Livre d'or -->
    <script src="https://unpkg.com"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
