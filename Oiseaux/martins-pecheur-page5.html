       body { font-family: "Montez", cursive; background: #1a1a1a; color: white; margin: 0; padding: 20px; margin-top: 20px; }
.galerie { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }

/* On crée la boîte qui va contenir l'image ET son texte ensemble */
.galerie figure, .photo-item { background: #222; padding: 10px; border-radius: 8px; border: 1px solid #7A4801; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; margin: 0; display: flex; flex-direction: column; }

/* L'image prend sa place nette à l'intérieur */
.galerie img { width: 100%; height: 180px; object-fit: cover; object-position: center; border-radius: 4px; cursor: pointer; }

/* Le texte se place parfaitement en dessous */
.galerie p, .galerie figcaption { color: white; text-align: center; margin-top: 10px; margin-bottom: 0; font-family: "Montez", cursive; font-size: 1.2rem; }

.bouton-retour { display: inline-block; padding: 10px; border-radius: 8px; border: 1px solid #7A4801; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-decoration: none; color: #E1C9A8; font-weight: bold; }
.bouton-retour:hover { color: white; }



    /* Style pour les petits boutons ronds de navigation */
.nav-bouton-rond {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 65px;
    height: 65px;
    border-radius: 50%; /* Rend le bouton parfaitement rond */
    background: linear-gradient(135deg, #a86b18, #613903); /* Ton dégradé marron/orange */
    border: 2px solid #fbae41;
    color: white !important;
    text-decoration: none;
    font-size: 20px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* La jolie ombre portée */
    transition: all 0.3s ease; /* Pour une animation fluide */
    cursor: pointer;
    box-shadow: 0px 0px 10px 0px #d6cd9c; }

/* Effet au survol de la souris */
.nav-bouton-rond:hover {
    transform: translateY(-3px); /* Le bouton se soulève légèrement */
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7); /* L'ombre devient plus intense */
    background: linear-gradient(135deg, #c58224, #7a4801); /* Éclaircissement au survol */
}

/* Conteneur pour aligner les deux boutons côte à côte */

<script>
    // Système d'affichage automatique des descriptions blanches à partir du "alt"
    document.querySelectorAll('.photo-item').forEach(item => {
        const img = item.querySelector('img');
        if (img && img.getAttribute('alt')) {
            const desc = document.createElement('div');
            desc.className = 'description';
            desc.style.cssText = "margin-top: 10px; font-weight: bold; color: #fff; font-size: 25px; text-align: center;";
            desc.innerText = img.getAttribute('alt');
            item.appendChild(desc);
        }
    });

    // Système de zoom Pop-up automatique au clic
    const popup = document.createElement('div');
    popup.style.cssText = "display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; cursor:pointer;";
    const popupImg = document.createElement('img');
    popupImg.style.cssText = "max-width:90%; max-height:85%; border-radius:8px; object-fit:contain;";
    popup.appendChild(popupImg);
    document.body.appendChild(popup);

    document.querySelectorAll('.photo-item img').forEach(img => {
        img.style.cursor = "pointer";
        img.addEventListener('click', () => {
            popupImg.src = img.src;
            popup.style.display = "flex";
        });
    });

    popup.addEventListener('click', () => {
        popup.style.display = "none";
    });
</script>
