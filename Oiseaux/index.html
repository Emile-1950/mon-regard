    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding: 10px; margin-top: 10px; }
        .menu-oiseaux { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 40px auto; max-width: 800px; }
        .btn-oiseau { padding: 15px; font-size: 16px; font-weight: bold; color: white; background-color: #1e1e1e; border: 2px solid #333; border-radius: 8px; cursor: pointer; transition: 0.3s; text-align: center; }
        .btn-oiseau:hover { background-color: #2a2a2a; border-color: #007bff; transform: scale(1.02); }
        .bouton-accueil { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #aaa; }
        .bouton-accueil:hover { color: #fff; }

        .nav-bouton-rond {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 65px;
    height: 65px;
    border-radius: 50%; /* Rend le bouton parfaitement rond */
    background: linear-gradient(135deg, #a86b18, #613903); /* Ton dégradé marron/orange */
    border: 2px solid #fbae41;
    color: white !important;
    text-decoration: none;
    font-size: 20px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* La jolie ombre portée */
    transition: all 0.3s ease; /* Pour une animation fluide */
    cursor: pointer;
    box-shadow: 0px 0px 10px 0px #d6cd9c; }
</style>
