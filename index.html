<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Souvenirs Photo</title>
    <style>
        /* --- STYLE CSS --- */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #111;
        }

        header p {
            font-size: 1.1rem;
            color: #666;
        }

        /* ÉCRAN D'ACCUEIL : La grille des Dossiers */
        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        .album-card {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .album-card:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .album-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .album-title {
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #111;
            background-color: #fff;
            border-top: 1px solid #eee;
        }

        /* ÉCRAN GALERIE (Masqué au départ) */
        .gallery-view {
            display: none;
            width: 90%;
            max-width: 1200px;
            flex-direction: column;
            align-items: center;
        }

        .back-btn {
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #444;
        }

        .gallery-title {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #111;
            text-transform: capitalize;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            padding-bottom: 40px;
        }

        .photo-item {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-item:hover {
            transform: translateY(-5px);
        }

        .photo-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .photo-info {
            padding: 15px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
        }

        /* Zoom de la photo (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 4px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px; right: 30px;
            color: #fff; font-size: 40px; font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Les Souvenirs Photo de [Votre Nom]</h1>
        <p>Archives et clichés depuis 2015</p>
    </header>

    <!-- ==================== ÉCRAN 1 : LES DOSSIERS (ACCUEIL) ==================== -->
    <div id="albums-view" class="albums-grid">
        
        <!-- Album Macro -->
        <div class="album-card" onclick="openGallery('macro')">
            <img src="https://unsplash.com" alt="Couverture Macro">
            <div class="album-title">🔍 Photo Macro</div>
        </div>

        <!-- Album Paysage -->
        <div class="album-card" onclick="openGallery('paysage')">
            <img src="https://unsplash.com" alt="Couverture Paysage">
            <div class="album-title">🏔️ Photo Paysage</div>
        </div>

        <!-- Album Oiseaux -->
        <div class="album-card" onclick="openGallery('oiseaux')">
            <img src="https://unsplash.com" alt="Couverture Oiseaux">
            <div class="album-title">🦅 Photo Oiseaux</div>
        </div>

        <!-- Album Voyage -->
        <div class="album-card" onclick="openGallery('voyage')">
            <img src="https://unsplash.com" alt="Couverture Voyage">
            <div class="album-title">🚗 Photo Voyage</div>
        </div>

    </div>

    <!-- ==================== ÉCRAN 2 : LA GALERIE D'UN ALBUM (CACHÉE) ==================== -->
    <div id="gallery-view" class="gallery-view">
        <button class="back-btn" onclick="closeGallery()">🔙 Retour aux albums</button>
        <h2 id="current-gallery-title" class="gallery-title">Nom de l'album</h2>
        
        <div class="gallery-grid" id="gallery-images-container">
            <!-- Les photos s'injecteront ici dynamiquement grâce au JavaScript -->
        </div>
    </div>

    <!-- Zone des Commentaires (Toujours visible en bas) -->
    <div style="width: 90%; max-width: 800px; margin: 50px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);">
        <h2 style="text-align: center; margin-bottom: 20px; color: #111;">💬 Espace Commentaires</h2>
        <p style="text-align: center; color: #666; font-style: italic;">L'espace de discussion est en cours de configuration...</p>
    </div>

    <!-- Fenêtre de zoom -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Zoom">
    </div>

    <!-- --- JAVASCRIPT (La base de données de vos photos) --- -->
    <script>
        // ======= RANGEZ VOS LIENS DE PHOTOS ICI APRÈS VOTRE SIESTE =======
        const photoDatabase = {
            macro: [
                { src: "https://unsplash.com", desc: "Macro exemple 1 (2015)" },
                { src: "https://unsplash.com", desc: "Macro exemple 2" },
                { src: "", desc: "Macro 3 (Emplacement libre)" },
                { src: "", desc: "Macro 4 (Emplacement libre)" }
            ],
            paysage: [
                { src: "https://unsplash.com", desc: "Paysage exemple 1" },
                { src: "https://unsplash.com", desc: "Paysage exemple 2" }
            ],
            oiseaux: [
                { src: "https://unsplash.com", desc: "Oiseau exemple 1" },
                { src: "https://unsplash.com", desc: "Oiseau exemple 2" }
            ],
            voyage: [
                { src: "https://unsplash.com", desc: "Voyage exemple 1" },
                { src: "https://unsplash.com", desc: "Voyage exemple 2" }
            ]
        };

        // Fonction pour ouvrir un album
        function openGallery(category) {
            // Masquer l'accueil des dossiers
            document.getElementById('albums-view').style.display = 'none';
            
            // Configurer le titre de la galerie
            document.getElementById('current-gallery-title').innerText = "Dossier : " + category;
            
            // Vider et reconstruire la grille de photos
            const container = document.getElementById('gallery-images-container');
            container.innerHTML = "";
            
            // Récupérer les photos de la catégorie choisie
            const photos = photoDatabase[category];
            
            photos.forEach(photo => {
                if(photo.src === "") return; // Ignore les cases vides
                
                const item = document.createElement('div');
                item.className = 'photo-item';
                item.onclick = function() { openLightbox(photo.src); };
                item.innerHTML = `
                    <img src="${photo.src}" alt="${photo.desc}">
                    <div class="photo-info">${photo.desc}</div>
                `;
                container.appendChild(item);
            });
            
            // Afficher l'écran galerie
            document.getElementById('gallery-view').style.display = 'flex';
        }

        // Fonction pour revenir en arrière
        function closeGallery() {
            document.getElementById('gallery-view').style.display = 'none';
            document.getElementById('albums-view').style.display = 'grid';
        }
