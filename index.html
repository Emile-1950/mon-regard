<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Regard - Portfolio</title>
    
    <style>
    /* Chargement officiel de la police Google Fonts */
    @import url('https://googleapis.com');

    /* Classe pour la police cursive globale */
    .qwither-grypen-bold {
        font-family: "Qwitcher Grypen", cursive;
        font-weight: 700;
        font-style: normal;
    }

    body { 
        background: #1a1a1a; 
        color: #333; 
        padding: 0px !important; 
        display: flex; 
        flex-direction: column; 
        align-items: center;
        margin-top: 10px !important;
    }

    /* Grille des 12 rubriques */
    .menu-container { 
        display: grid; 
        grid-template-columns: repeat(4, 1fr); 
        gap: 10px; 
        width: 100%; 
        max-width: 1250px; 
        margin-top: 25px !important;
    }

    /* 1. LA BARRE DU HAUT (Titre à gauche, boutons à droite) */
    .ma-banniere-accueil {
        position: relative;
        width: 100%;
        max-width: 1250px;
        margin: 10px auto 20px auto !important;
        display: flex;
        justify-content: space-between !important; /* Pousse le titre à gauche et les boutons à droite */
        align-items: center;
        background: none !important;
        border: none !important;
        box-shadow: none !important;
        height: auto !important;
        padding: 0 10px !important;
    }

    .mes-boutons-droite {
        display: flex;
        gap: 12px;
    }

    /* Style spécifique pour les 3 boutons du haut (noirs et compacts) */
    .mes-boutons-droite .folder-btn {
        background: #111111 !important; /* Fond noir uni */
        border: 1px solid #7A4801 !important;
        padding: 6px 16px !important;
        font-size: 24px !important; 
        font-family: "Qwitcher Grypen", cursive !important;
        font-weight: 700 !important;
        color: white !important;
        border-radius: 6px !important;
        box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5) !important;
        cursor: pointer;
        transition: all 0.2s ease;
        margin: 0 !important; 
        width: auto !important; 
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .mes-boutons-droite .folder-btn:hover {
        background: #222 !important;
        border-color: #E1C9A8 !important;
        transform: translateY(-1px);
    }

    /* 🎨 LE DESIGN DE TON TITRE LOGO BICOLORE */
    .mon-titre-logo {
        display: inline-flex;
        align-items: center;
        border: 2px solid #7A4801;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.6);
        font-family: "Qwitcher Grypen", cursive !important;
    }

    .mon-titre-logo .partie-claire {
        background: #E1C9A8;
        color: #4A2E0B;
        padding: 6px 16px;
        font-size: 32px;
        font-weight: 700;
    }

    .mon-titre-logo .partie-sombre {
        background: #111111;
        color: #E1C9A8;
        padding: 6px 16px;
        font-size: 26px;
        font-weight: 700;
        border-left: 1px solid #7A4801;
    }

    /* 2. LES BOUTONS DE CATÉGORIES (Grille principale du bas) */
    .menu-container .folder-btn { 
        background: #111111 !important; 
        border: 1px solid #7A4801 !important; 
        padding: 14px 15px !important; 
        font-family: "Qwitcher Grypen", cursive !important; 
        font-size: 26px !important; 
        font-weight: 700 !important; 
        color: #fff !important;
        border-radius: 8px !important; 
        cursor: pointer; 
        display: flex;
        align-items: center;
        justify-content: flex-start;
        box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
        transition: all 0.2s ease;
    }

    .menu-container .folder-btn:hover {
        transform: translateY(-2px);
        background: #222 !important;
        border-color: #E1C9A8 !important;
        box-shadow: 3px 5px 15px rgba(0,0,0,0.7);
    }

    /* Les petites icônes Lucide en dégradé chaud */
    .folder-btn [data-lucide] {
        margin-right: 12px;
        vertical-align: middle;
        background: linear-gradient(135deg, #ff9f43, #ff5252) !important;
        padding: 5px !important;
        border-radius: 6px !important;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3) !important;
        color: white !important;
        stroke-width: 2.5 !important;
        width: 16px !important;
        height: 16px !important;
    }

    /* 3. LE MESSAGE DE NOTATION TOUT EN BAS */
    .footer-text {
        font-family: "Qwitcher Grypen", cursive !important;
        font-size: 24px !important; 
        font-weight: 700;
        color: #fff !important;
        text-align: center;
        margin-top: 40px !important;
        width: 100%;
        margin-bottom: 30px;
    }

    /* Tablettes et mobiles */
    @media (max-width: 1024px) { .menu-container { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .menu-container { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <!-- Conteneur principal bien cadré -->
    <div style="position: relative; width: 100%; max-width: 1250px; margin: 0 auto; padding: 0 10px; box-sizing: border-box;">

        <!-- 1. La barre du haut autonome (Titre + Boutons) -->
        <div class="ma-banniere-accueil">
            <div class="mon-titre-logo">
                <span class="partie-claire">Mon Regard</span>
                <span class="partie-sombre">Un espace photographique</span>
            </div>

            <div class="mes-boutons-droite">
                <button class="folder-btn" onclick="window.location.href='index.html'"><i data-lucide="house"></i> Accueil</button>
                <button class="folder-btn" onclick="window.location.href='commentaires.html'"><i data-lucide="book-open"></i> Livre d'or</button>
                <button class="folder-btn" onclick="window.location.href='mailto:pochbe@outlook.fr'"><i data-lucide="mail"></i> Contact</button>
            </div>
        </div>

        <!-- 2. Grande photo de forêt -->
        <img src="https://filedn.eu" style="width: 100%; height: 350px; object-fit: cover; border-radius: 15px; display: block; box-shadow: 0px 0px 30px 5px rgba(219, 209, 149, 0.5); border: 4px double #7A4801; box-sizing: border-box;">

        <!-- 3. Grille complète des 12 dossiers de rubriques -->
        <div class="menu-container">
            <button class="folder-btn" onclick="window.location.href='paysages.html'"><i data-lucide="image"></i> Photo Paysage</button>
            <button class="folder-btn" onclick="window.location.href='oiseaux.html'"><i data-lucide="twitter"></i> Photo Oiseaux</button>
            <button class="folder-btn" onclick="window.location.href='macro.html'"><i data-lucide="flower-2"></i> Photo Macro</button>
            <button class="folder-btn" onclick="window.location.href='nature.html'"><i data-lucide="tree-pine"></i> Photo Nature</button>

            <button class="folder-btn" onclick="window.location.href='voyages.html'"><i data-lucide="plane"></i> Photo Voyages</button>
            <button class="folder-btn" onclick="window.location.href='architecture.html'"><i data-lucide="building"></i> Photo Architecture</button>
            <button class="folder-btn" onclick="window.location.href='portraits.html'"><i data-lucide="users"></i> Photo Portraits</button>
            <button class="folder-btn" onclick="window.location.href='animaux.html'"><i data-lucide="paw-print"></i> Photo Animaux</button>

            <button class="folder-btn" onclick="window.location.href='noir-blanc.html'"><i data-lucide="contrast"></i> Noir & Blanc</button>
            <button class="folder-btn" onclick="window.location.href='lever-coucher.html'"><i data-lucide="sunrise"></i> Lever / Coucher</button>
            <button class="folder-btn" onclick="window.location.href='eau.html'"><i data-lucide="droplet"></i> Éléments d'Eau</button>
            <button class="folder-btn" onclick="window.location.href='nocturne.html'"><i data-lucide="moon"></i> Photo Nocturne</button>
        </div>

        <!-- 4. Pied de page -->
        <div class="footer-text">
            Mon Regard © 2026 - Tous droits réservés
        </div>

    </div>

    <!-- Script indispensable pour faire apparaître tes petites icônes Lucide -->
    <script src="https://unpkg.com"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
