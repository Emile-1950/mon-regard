<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📷 Mon Regard Photographique</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; text-align: center; }
        
        /* Ta superbe bannière originale double liseré or */
        .banner { max-width: 900px; margin: 20px auto; border-radius: 12px; border: 3px double #7A4801; box-shadow: 1px 1px 15px rgba(225, 201, 168, 0.4); padding: 10px; background: rgba(20, 20, 20, 0.6); }
        .banner img { width: 100%; height: auto; border-radius: 8px; display: block; }
        
        /* Le menu principal avec son magnifique dégradé de couleurs */
        .nav-container { max-width: 800px; margin: 40px auto; padding: 20px; background: linear-gradient(135deg, #111e2e, #4a122e); border-radius: 15px; border: 1px solid #7A4801; box-shadow: inset 0 0 15px rgba(225, 201, 168, 0.3); display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        
        /* Ta grille de 12 boutons en version Luciole d'origine */
        .grid-categories { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 900px; margin: 30px auto; }
        
        /* Le bouton Luciole d'Émile avec son dégradé orange et marron royal */
        .folder-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #a86b18, #613903) !important; color: white !important; border: none !important; padding: 12px 15px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; text-decoration: none; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.4); transition: transform 0.2s; }
        .folder-btn:hover { transform: scale(1.03); box-shadow: 0 6px 12px rgba(225, 201, 168, 0.3); }
        
        /* Le petit rectangle orange vif bien intégré */
        .orange-bar { width: 8px; height: 14px; background: #ff7b00; border-radius: 2px; display: inline-block; flex-shrink: 0; box-shadow: 0 0 8px #ff7b00; }
        
        .footer-text { font-family: 'Georgia', serif; font-style: italic; color: #E1C9A8; margin-top: 40px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Ton panorama brumeux restauré avec le bon lien direct -->
    <div class="banner">
        <img src="https://filedn.eu" alt="Paysage brumeux">
    </div>

    <!-- Menu principal du haut -->
    <div class="nav-container">
        <a href="index.html" class="folder-btn"><span class="orange-bar"></span> Accueil</a>
        <a href="commentaires.html" class="folder-btn"><span class="orange-bar"></span> Livre d'or</a>
        <a href="contact.html" class="folder-btn"><span class="orange-bar"></span> Contact</a>
    </div>

    <!-- Tes 12 catégories en version boutons Lucioles luminescents -->
    <div class="grid-categories">
        <a href="voyages/index.html" class="folder-btn"><span class="orange-bar"></span> Voyages</a>
        <a href="Oiseaux/index.html" class="folder-btn"><span class="orange-bar"></span> Oiseaux</a>
        <a href="Fleurs/index.html" class="folder-btn"><span class="orange-bar"></span> Fleurs</a>
        <a href="insectes/index.html" class="folder-btn"><span class="orange-bar"></span> Insectes</a>
        
        <a href="ciels/index.html" class="folder-btn"><span class="orange-bar"></span> Ciels</a>
        <a href="macros/index.html" class="folder-btn"><span class="orange-bar"></span> Macros</a>
        <a href="paysages/index.html" class="folder-btn"><span class="orange-bar"></span> Paysages</a>
        <a href="animaux-divers/index.html" class="folder-btn"><span class="orange-bar"></span> Animaux divers</a>
        
        <a href="saisons/index.html" class="folder-btn"><span class="orange-bar"></span> Saisons</a>
        <a href="papillons/index.html" class="folder-btn"><span class="orange-bar"></span> Papillons</a>
        <a href="cervides/index.html" class="folder-btn"><span class="orange-bar"></span> Cervidés</a>
        <a href="renards/index.html" class="folder-btn"><span class="orange-bar"></span> Renards</a>
    </div>

    <p class="footer-text">Sélectionnez une catégorie ci-dessus pour découvrir la galerie.</p>

</body>
</html>
