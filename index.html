<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📷 Mon Regard Photographique</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; text-align: center; }
        
        /* Ta grande bannière brumeuse bien centrée */
        .banner { max-width: 900px; margin: 20px auto; border-radius: 12px; border: 3px double #7A4801; box-shadow: 1px 1px 15px rgba(225, 201, 168, 0.4); padding: 10px; }
        .banner img { width: 100%; height: auto; border-radius: 8px; display: block; }
        
        /* La boîte du menu principal (Accueil, Livre d'or, Contact) */
        .nav-container { max-width: 800px; margin: 40px auto; padding: 20px; background: linear-gradient(135deg, #111e2e, #4a122e); border-radius: 15px; border: 1px solid #7A4801; box-shadow: inset 0 0 15px rgba(225, 201, 168, 0.2); display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        
        /* La grille des 12 boutons du bas alignée à la perfection */
        .grid-categories { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 900px; margin: 30px auto; }
        
        /* Le bouton d'Émile aligné horizontalement avec display: inline-flex */
        .folder-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #222; color: #E1C9A8; border: 1px solid #444; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; text-decoration: none; box-sizing: border-box; transition: background 0.2s; }
        .folder-btn:hover { background: #333; color: white; border-color: #7A4801; }
        
        /* Le petit rectangle orange Luciole bien droit */
        .orange-bar { width: 10px; height: 16px; background: #ff6b35; border-radius: 3px; display: inline-block; flex-shrink: 0; }
        
        .footer-text { font-family: 'Georgia', serif; font-style: italic; color: #888; margin-top: 40px; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Ta superbe photo brumeuse du matin -->
    <div class="banner">
        <img src="https://filedn.eu" alt="Paysage brumeux">
    </div>

    <!-- Les 3 boutons du menu principal (Orange bars intégrés) -->
    <div class="nav-container">
        <a href="index.html" class="folder-btn"><span class="orange-bar"></span> Accueil</a>
        <a href="commentaires.html" class="folder-btn"><span class="orange-bar"></span> Livre d'or</a>
        <a href="contact.html" class="folder-btn"><span class="orange-bar"></span> Contact</a>
    </div>

    <!-- Tes 12 catégories rangées au millimètre sur des rails parfaits -->
    <div class="grid-categories">
        <a href="voyages/index.html" class="folder-btn"><span class="orange-bar"></span> Voyages</a>
        <a href="Oiseaux/index.html" class="folder-btn"><span class="orange-bar"></span> Oiseaux</a>
        <a href="Fleurs/index.html" class="folder-btn"><span class="orange-bar"></span> Fleurs</a>
        <a href="insectes/index.html" class="folder-btn"><span class="orange-bar"></span> Insectes</a>
        
        <a href="ciels/index.html" class="folder-btn"><span class="orange-bar"></span> Ciels</a>
        <a href="macros/index.html" class="folder-btn"><span class="orange-bar"></span> Macros</a>
        <a href="paysages/index.html" class="folder-btn"><span class="orange-bar"></span> Paysages</a>
        <a href="animaux-divers/index.html" class="folder-btn"><span class="orange-bar"></span> Animaux divers</a>
        
        <a href="saisons/index.html" class="folder-btn"><span class="orange-bar"></span> Saisons</a>
        <a href="papillons/index.html" class="folder-btn"><span class="orange-bar"></span> Papillons</a>
        <a href="cervides/index.html" class="folder-btn"><span class="orange-bar"></span> Cervidés</a>
        <a href="renards/index.html" class="folder-btn"><span class="orange-bar"></span> Renards</a>
    </div>

    <p class="footer-text">Sélectionnez une catégorie ci-dessus pour découvrir la galerie.</p>

</body>
</html>
