        function openGallery(category) {
            document.getElementById('welcome-msg').style.display = 'none';
            const buttons = document.querySelectorAll('.folder-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
            
            document.getElementById('current-gallery-title').innerText = category;
            const container = document.getElementById('gallery-images-container');
            container.innerHTML = "";
            
            const photos = photoDatabase[category];
            if (photos && photos.length > 0) {
                photos.forEach(photo => {
                    if(!photo.src || photo.src === "") return;
                    const item = document.createElement('div');
                    item.className = 'photo-item';
                    item.onclick = function() { openLightbox(photo.src); };
                    item.innerHTML = `
                        <img src="${photo.src}">
                        <div class="photo-info">${photo.desc}</div>
                    `;
                    container.appendChild(item);
                });
            }
            if (container.children.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #888; font-style: italic;'>Cet album ne contient pas encore de photos.</p>";
            }
            document.getElementById('gallery-view').style.display = 'flex';
        }

        function resetToHome() {
            document.getElementById('gallery-view').style.display = 'none';
            document.getElementById('welcome-msg').style.display = 'block';
            const buttons = document.querySelectorAll('.folder-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollTopBtn.style.display = "flex";
            } else {
                scrollTopBtn.style.display = "none";
            }
        };
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
    </script>

    <div style="width: 100%; max-width: 1250px; margin: 40px auto; padding: 30px 20px; box-sizing: border-box; background-image: url('https://filedn.eu'); background-size: cover; background-position: center; border-radius: 15px; box-shadow: 1px 1px 10px #E1C9A8; border: 3px #7A4801 double; text-align: center;">

        <p style="color: white; font-size: 15px; margin-bottom: 25px;">Écrivez votre message ci-dessous. En cliquant sur le bouton, votre application de messagerie s'ouvrira pour me l'envoyer directement !</p>

        <form action="mailto:pochbe@outlook.fr" method="GET" enctype="text-plain" style="max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px;">
            
            <!-- Le sujet de l'e-mail automatique -->
            <input type="hidden" name="subject" value="Un petit mot pour le Livre d'or d'Émile">
            
            <!-- La grande case pour écrire le message -->
            <textarea name="body" placeholder="Votre prénom, suivi de votre gentil message ici..." rows="5" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #7A4801; background-color: rgba(26, 26, 26, 0.9); color: white; font-size: 16px; font-family: sans-serif; resize: vertical; box-sizing: border-box;"></textarea>
            
            <!-- Le bouton envoyer orange en relief -->
            <button type="submit" class="folder-btn" style="color: white !important; background: linear-gradient(135deg, #a86b18, #613903) !important; border: none !important; padding: 12px 30px !important; font-size: 16px !important; font-weight: bold !important; border-radius: 25px !important; box-shadow: 0 4px 6px rgba(0,0,0,0.4) !important; cursor: pointer !important; align-self: center; transition: 0.2s;">🚀 Envoyer mon message</button>
            
        </form>
