<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Souvenirs Photo d'Émile</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .banner { width: 100%; background: #111; color: #fff; text-align: center; padding: 40px; box-sizing: border-box; }
        .home-btn { background: transparent; color: #fff; border: 1px solid #fff; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .menu-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 90%; max-width: 900px; margin: 30px 0; }
        .folder-btn { background: #fff; border: 1px solid #ccc; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .folder-btn:hover, .folder-btn.active { background: #111; color: #fff; }
        .gallery-view { width: 90%; max-width: 1200px; display: none; flex-direction: column; align-items: center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; }
        .photo-item { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.06); cursor: pointer; }
        .photo-item img { width: 100%; height: 220px; object-fit: cover; display: block; }
        .photo-info { padding: 15px; text-align: center; font-weight: 500; }
        #welcome-msg { text-align: center; color: #777; font-style: italic; margin: 40px 0; }
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .lightbox img { max-width: 90%; max-height: 85%; border-radius: 4px; }
        .scroll-top-btn { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; background: #111; color: #fff; border: 2px solid #fff; border-radius: 50%; font-size: 1.5rem; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 2000; }
    </style>
</head>
<body>

    <div class="banner">
        <h1>Les Souvenirs Photo d'Émile</h1>
        <p>Clichés et archives depuis 2015</p>
        <button class="home-btn" onclick="resetToHome()">🏠 Accueil</button>
    </div>

    <div class="menu-container">
        <button class="folder-btn" onclick="openGallery('fleurs')">🌸 Fleurs</button>
        <button class="folder-btn" onclick="openGallery('insectes')">🐞 Insectes</button>
        <button class="folder-btn" onclick="openGallery('ciels')">☁️ Ciels</button>
        <button class="folder-btn" onclick="openGallery('macros')">🔍 Macros</button>
        <button class="folder-btn" onclick="openGallery('paysages')">🏔️ Paysages</button>
        <button class="folder-btn" onclick="openGallery('oiseaux')">🦅 Oiseaux</button>
        <button class="folder-btn" onclick="openGallery('animaux')">🦊 Animaux divers</button>
        <button class="folder-btn" onclick="openGallery('saisons')">🍂 Saisons</button>
    </div>

    <div id="welcome-msg">Sélectionnez une catégorie ci-dessus pour découvrir la galerie.</div>

    <div id="gallery-view" class="gallery-view">
        <h2 id="current-gallery-title" style="font-size: 1.6rem; margin-bottom: 25px; text-transform: capitalize;">Nom</h2>
        <div class="gallery-grid" id="gallery-images-container"></div>
    </div>

    <button id="scrollTopBtn" class="scroll-top-btn" onclick="scrollToTop()">⤊</button>
    <div id="lightbox" class="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src=""></div>

    <script>
        const photoDatabase = {
            fleurs: [
                { src: "https://filedn.eu", desc: "tulipier de virginie" },
                { src: "https://postimg.cc", desc: "gerbera" },
                { src: "https://postimg.cc", desc: "coquelicot" }
            ],
            insectes: [], ciels: [], macros: [], paysages: [], oiseaux: [], animaux: [],
            saisons: [
                { src: "https://filedn.eu", desc: "frimas d'hiver" }
            ]
        };

        function openGallery(category) {
            document.getElementById('welcome-msg').style.display = 'none';
            document.querySelectorAll('.folder-btn').forEach(btn => btn.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
            document.getElementById('current-gallery-title').innerText = category;
            const container = document.getElementById('gallery-images-container');
            container.innerHTML = "";
            const photos = photoDatabase[category];
            if (photos && photos.length > 0) {
                photos.forEach(photo => {
                    const item = document.createElement('div');
                    item.className = 'photo-item';
                    item.onclick = function() { openLightbox(photo.src); };
                    item.innerHTML = `<img src="${photo.src}"><div class="photo-info">${photo.desc}</div>`;
                    container.appendChild(item);
                });
            }
            if (container.children.length === 0) { container.innerHTML = "<p style='text-align:center;color:#888;font-style:italic;'>Album vide.</p>"; }
            document.getElementById('gallery-view').style.display = 'flex';
        }

        function resetToHome() {
            document.getElementById('gallery-view').style.display = 'none';
            document.getElementById('welcome-msg').style.display = 'block';
            document.querySelectorAll('.folder-btn').forEach(btn => btn.classList.remove('active'));
        }

        function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').style.display = 'flex'; }
        function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) { scrollTopBtn.style.display = "flex"; }
            else { scrollTopBtn.style.display = "none"; }
        };
        function scrollToTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }
    </script>
</body>
</html>
