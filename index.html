<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📷 Mon Regard Photographique</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; text-align: center; }
        
        /* Ta superbe bannière originale double liseré or élargie avec espace en bas */
        .banner { max-width: 1250px; margin: 20px auto 40px auto; border-radius: 12px; border: 3px double #7A4801; box-shadow: 1px 1px 15px rgba(225, 201, 168, 0.4); padding: 10px; background: rgba(20, 20, 20, 0.6); }
        .banner img { width: 100%; height: auto; border-radius: 8px; display: block; }
        
        /* Ta grille de 12 catégories en version 1250px */
        .grid-categories { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 1250px; margin: 30px auto; }
        
        /* Le menu principal d'Émile, parfaitement resserré et regroupé au centre */
        .nav-container { max-width: 950px; margin: 30px auto 40px auto; padding: 15px; background: linear-gradient(135deg, #111e2e, #4a122e); border-radius: 15px; border: 1px solid #7A4801; box-shadow: inset 0 0 15px rgba(225, 201, 168, 0.3); display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; box-sizing: border-box; }
        
        /* Tes magnifiques dossiers travaillés avec leur fond texturé d'origine */
        .folder-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: url('https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Bannie%CC%80re/94013.jpg') ; border: 1px solid #7A4801; padding: 12px 25px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 5px; text-decoration: none; color: white !important; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .folder-btn:hover { transform: scale(1.02); box-shadow: 0 4px 10px rgba(225, 201, 168, 0.3); }
        
        /* Force tes jolis dessins à s'allumer en blanc pur */
        .folder-btn [data-lucide] { width: 18px; height: 18px; color: white !important; display: inline-block; }

        .footer-text { font-family: 'Georgia', serif; font-style: italic; color: #E1C9A8; margin-top: 40px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Ta magnifique bannière de lever de soleil -->
    <div class="banner">
        <img src="https://filedn.eu/lOR6k51X5UUSXzy7hr2EvS4/Bannie%CC%80re/IMG_1504%20(2).png" alt="Paysage brumeux">
    </div>

        <!-- Les 3 boutons du haut avec leurs dessins blancs -->
    <div class="nav-container">
        <a href="index.html" class="folder-btn"><i data-lucide="home"></i> Accueil</a>
        <a href="commentaires.html" class="folder-btn"><i data-lucide="book-open"></i> Livre d'or</a>
        <a href="contact.html" class="folder-btn"><i data-lucide="mail"></i> Contact</a>
    </div>

    <!-- Ta grande grille de 12 boutons avec les 12 icônes officielles validées -->
    <div class="grid-categories">
        <a href="voyages/index.html" class="folder-btn"><i data-lucide="plane"></i> Voyages</a>
        <a href="Oiseaux/index.html" class="folder-btn"><i data-lucide="twitter"></i> Oiseaux</a>
        <a href="Fleurs/index.html" class="folder-btn"><i data-lucide="flower"></i> Fleurs</a>
        <a href="Insectes/index.html" class="folder-btn"><i data-lucide="bug"></i> Insectes</a>
        
        <a href="ciels/index.html" class="folder-btn"><i data-lucide="cloud-sun"></i> Ciels</a>
        <a href="macros/index.html" class="folder-btn"><i data-lucide="zoom-in"></i> Macros</a>
        <a href="paysages/index.html" class="folder-btn"><i data-lucide="image"></i> Paysages</a>
        <a href="animaux-divers/index.html" class="folder-btn"><i data-lucide="paw-print"></i> Animaux divers</a>
        
        <a href="saisons/index.html" class="folder-btn"><i data-lucide="calendar"></i> Saisons</a>
        <a href="papillons/index.html" class="folder-btn"><i data-lucide="leaf"></i> Papillons</a>
        <a href="cervides/index.html" class="folder-btn"><i data-lucide="trees"></i> Cervidés</a>
        <a href="renards/index.html" class="folder-btn"><i data-lucide="binoculars"></i> Renards</a>
    </div>

    <p class="footer-text">Sélectionnez une catégorie ci-dessus pour découvrir la galerie.</p>

        <!-- Le traducteur obligatoire pour allumer tes jolis dessins blancs -->
    <script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
