<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📷 Mon Regard Photographique</title>

<style>   
@import url('https://googleapis.com');

/* Classe pour la police cursive */
.qwitcher-grypen-regular {
  font-family: "Qwitcher Grypen", cursive;
  font-weight: 400;
  font-style: normal; 
}

body { 
  background: #1a1a1a; 
  color: #333; 
  padding: 0px !important; 
  display: flex;         
  flex-direction: column; 
  align-items: center; 
  margin-top: 15px !important; 
}

/* Conteneur des boutons du haut : maintenant au-dessus de la bannière */
.ma-banniere-accueil {
  width: 100%;
  max-width: 1250px;
  display: flex;
  justify-content: flex-end;
  gap: 12px; 
  margin-bottom: 10px; /* Crée un petit espace avant la photo */
}

/* Style mini élégant pour les trois boutons du haut */
.ma-banniere-accueil .folder-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px; 
  padding: 5px 12px !important; 
  font-size: 12px !important; 
  font-weight: bold;
  color: white !important;
  border: 1px solid #7A4801 !important;
  border-radius: 6px !important; 
  background: #111 !important;
  box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5) !important;
  cursor: pointer;
  transition: all 0.2s ease;
  margin: 0 !important;  
}

.ma-banniere-accueil .folder-btn:hover {
  background: #222 !important;
  border-color: #E1C9A8 !important;
  transform: translateY(-1px); 
  box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.7) !important; 
}

/* Grille principale des catégories */
.menu-container { 
  display: grid; 
  grid-template-columns: repeat(4, 1fr); 
  gap: 2px; 
  width: 90%; 
  max-width: 1250px; 
  margin-top: 20px; 
}

/* Style général pour les gros boutons du menu */
.folder-btn { 
  background: url('https://filedn.eu'); 
  border: 1px solid #ccc; 
  padding: 15px 25px; 
  font-weight: bold; 
  border-radius: 6px; 
  cursor: pointer; 
  margin: 5px; 
}

.folder-btn:hover, .folder-btn.active { 
  background: #111; 
  color: #fff; 
}

/* Message d'accueil rapproché et taille ajustée */
#welcome-msg { 
  text-align: center; 
  color: #e0e0e0; 
  font-size: 1.8rem; 
  margin: 10px 0 40px 0; /* Rapproche fortement le texte de la grille du dessus */
}

@media (max-width: 768px) { 
  .menu-container { grid-template-columns: repeat(2, 1fr); } 
}

/* Style corrigé pour les icônes Lucide */
.folder-btn [data-lucide] {
  margin-right: 10px;
  vertical-align: middle;
  background: linear-gradient(135deg, #ff9f43, #ff5252); 
  padding: 6px;
  border-radius: 8px;
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
  color: white;
  stroke-width: 2.5;
  transition: all 0.3s ease;
  width: 16px;   /* Taille minimale pour afficher l'icône à l'intérieur */
  height: 16px;  /* Taille minimale pour afficher l'icône à l'intérieur */
  display: inline-block;
}

.folder-btn:hover [data-lucide] {
  transform: translateY(-3px) scale(1.1);
  box-shadow: 0 6px 12px rgba(255, 159, 67, 0.5); 
}
</style>
</head>
<body>

<!-- 1. Les boutons du haut, placés en dehors et au-dessus de la bannière -->
<div class="ma-banniere-accueil">
    <button class="folder-btn" onclick="window.location.href='index.html'"><i data-lucide="house"></i> Accueil</button>
    <button class="folder-btn" onclick="window.location.href='commentaires.html'"><i data-lucide="book-open"></i> Livre d'or</button>
    <button class="folder-btn" onclick="window.location.href='mailto:pochbe@outlook.fr'"><i data-lucide="mail"></i> Contact</button>
</div>

<!-- 2. Bloc contenant uniquement la grande photo de forêt -->
<div style="width: 100%; max-width: 1250px; margin: 0 auto;">
    <img src="https://filedn.eu" style="width: 100%; height: 350px; object-fit: cover; border-radius: 15px; display: block; box-shadow: 0px 0px 30px 5px rgba(219, 209, 149, 0.5); border: 4px double #7A4801;">
</div>

<!-- 3. Menu des catégories -->
<div class="menu-container">
    <button class="folder-btn" onclick="window.location.href='voyages/index.html'"><i data-lucide="compass"></i> Voyages</button>
    <button class="folder-btn" onclick="window.location.href='Oiseaux/index.html'" style="color: white !important;"><i data-lucide="feather"></i> Oiseaux</button>
    <button class="folder-btn" onclick="window.location.href='Fleurs/index.html'"><i data-lucide="flower"></i> Fleurs</button>
    <button class="folder-btn" onclick="window.location.href='Insectes/index.html'"><i data-lucide="bug"></i> Insectes</button>
    <button class="folder-btn" onclick="openGallery('ciels')"><i data-lucide="cloud-sun"></i> Ciels</button>
    <button class="folder-btn" onclick="openGallery('macros')"><i data-lucide="zoom-in"></i> Macros</button>
    <button class="folder-btn" onclick="openGallery('paysages')"><i data-lucide="mountain"></i> Paysages</button>
    <button class="folder-btn" onclick="openGallery('animaux')"><i data-lucide="paw-print"></i> Animaux divers</button>
    <button class="folder-btn" onclick="openGallery('saisons')"><i data-lucide="leaf"></i> Saisons</button>
    <button class="folder-btn" onclick="openGallery('papillons')"><i data-lucide="sparkles"></i> Papillons</button>
    <button class="folder-btn" onclick="openGallery('cervides')"><i data-lucide="trees"></i> Cervidés</button>
    <button class="folder-btn" onclick="openGallery('renards')"><i data-lucide="paw-print"></i> Renards</button>
</div>

<!-- 4. Message de bienvenue avec la classe de police appliquée -->
<div id="welcome-msg" class="qwitcher-grypen-regular">
    Sélectionnez une catégorie ci-dessus pour découvrir la galerie.
</div>

<!-- Ne pas oublier d'ajouter la bibliothèque Lucide à la fin du document si ce n'est pas fait -->
<script src="https://unpkg.com"></script>
<script>
  lucide.createIcons();
</script>

</body>
</html>
